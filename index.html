/* ---------- 캘린더로 보내기 (.ics) ---------- */
const ICS_SHIFT={"주":[[6,0],[19,30]],"야":[[18,0],[7,30]]};
function icsOpt(){return Object.assign({range:30,shift:"all",shiftAl:"eve",tasks:true,taskTime:"08:00",shared:true,stock:true,evAl:60,onlyNew:true},S.icsOpt||{});}
function icsStamp(d){return d.toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");}
function icsEsc(t){return String(t||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1");}
function icsFold(line){const out=[];let cur="",n=0;for(const ch of line){const b=new TextEncoder().encode(ch).length;if(n+b>73){out.push(cur);cur=" ";n=1;}cur+=ch;n+=b;}out.push(cur);return out.join("\r\n");}
function atT(ds,h,m){const d=parseD(ds);d.setHours(h,m,0,0);return d;}
function icsItems(o){
  const t=todayStr(),end=addDays(t,o.range),items=[];
  const inR=ds=>ds>=t&&ds<=end;
  if(o.shift!=="none"){for(let i=0;i<=o.range;i++){const ds=addDays(t,i);const sh=shiftOf(ds);const w=ICS_SHIFT[sh];
    const ov=isOv(ds);if(!w)continue;if(o.shift==="ov"&&!ov)continue;
    const s=atT(ds,w[0][0],w[0][1]);const e=atT(ds,w[1][0],w[1][1]);if(e<=s)e.setDate(e.getDate()+1);
    let al=null;if(o.shiftAl==="eve"){const a=atT(addDays(ds,-1),21,0);al=Math.round((s-a)/6e4);}else if(o.shiftAl!=="none")al=Number(o.shiftAl);
    items.push({uid:"shift-"+ds,title:(sh==="주"?"주간":"야간")+" 근무"+(ov?" (대근)":""),s,e,al});}}
  if(o.tasks){const [h,m]=o.taskTime.split(":").map(Number);
    S.tasks.filter(x=>!x.done&&x.due&&inR(x.due)).forEach(x=>{const s=atT(x.due,h,m);items.push({uid:"task-"+x.id,title:"할 일 마감: "+x.title,memo:x.memo,s,e:new Date(s.getTime()+15*6e4),al:0});});}
  const ev=(list,pre,cat)=>list.filter(x=>x.date&&inR(x.date)).forEach(x=>{
    if(x.time){const [h,m]=x.time.split(":").map(Number);const s=atT(x.date,h,m);items.push({uid:pre+x.id,title:(cat?"["+cat(x)+"] ":"")+x.title,memo:[x.stocks?"관련: "+x.stocks:"",x.memo||""].filter(Boolean).join("\n"),s,e:new Date(s.getTime()+60*6e4),al:Number(o.evAl)});}
    else items.push({uid:pre+x.id,title:(cat?"["+cat(x)+"] ":"")+x.title,memo:[x.stocks?"관련: "+x.stocks:"",x.memo||""].filter(Boolean).join("\n"),allDay:x.date,al:180});});
  if(o.shared)ev(SE,"shared-",x=>"함께");
  if(o.stock&&workOK)ev(S.events,"stock-",x=>x.cat||"주식");
  const now=Date.now();
  return items.filter(it=>it.allDay||it.e.getTime()>now).map(it=>(it.sig=[it.title,it.memo||"",it.s?it.s.getTime():it.allDay,it.e?it.e.getTime():"",it.al].join("|"),it));
}
function icsBuild(items){
  const now=icsStamp(new Date());
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//sucheop//KO","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:근무·매매 수첩"];
  items.forEach(it=>{const seq=((S.icsSent||{})[it.uid]||{}).q||0;
    L.push("BEGIN:VEVENT","UID:"+it.uid+"@sucheop","DTSTAMP:"+now,"SEQUENCE:"+seq);
    if(it.allDay){const d=it.allDay.replace(/-/g,"");L.push("DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+addDays(it.allDay,1).replace(/-/g,""));}
    else L.push("DTSTART:"+icsStamp(it.s),"DTEND:"+icsStamp(it.e));
    L.push("SUMMARY:"+icsEsc(it.title));if(it.memo)L.push("DESCRIPTION:"+icsEsc(it.memo));
    if(it.al!=null&&!isNaN(it.al))L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(it.title),"TRIGGER:"+(it.al<=0?"PT0M":"-PT"+it.al+"M"),"END:VALARM");
    L.push("END:VEVENT");});
  L.push("END:VCALENDAR");return L.map(icsFold).join("\r\n")+"\r\n";
}
function icsSheet(){
  const o=icsOpt();
  const sel=(id,cur,opts)=>`<select id="${id}">${opts.map(([v,n])=>`<option value="${v}" ${String(cur)===String(v)?"selected":""}>${n}</option>`).join("")}</select>`;
  const ck=(id,on,txt)=>`<label class="row" style="gap:8px"><input type="checkbox" id="${id}" ${on?"checked":""} style="width:18px;height:18px;accent-color:var(--accent)">${txt}</label>`;
  const inClaude=!!window.claude;
  sheet(`<form class="stack" id="icForm"><h2>캘린더로 보내기</h2>
    <p class="note">고른 일정을 알림 시간과 함께 휴대폰 캘린더에 넣어요. 알림은 캘린더가 울려 줘서 수첩을 안 켜도 돼요.</p>
    ${inClaude?`<p class="note" style="color:var(--q1)">이 기능은 홈 화면에 설치한 수첩 앱에서 돼요. Claude 안에서는 캘린더 파일을 내려받을 수 없어요.</p>`:""}
    <label class="field"><span class="label">기간</span>${sel("icR",o.range,[[14,"앞으로 2주"],[30,"앞으로 한 달"],[90,"앞으로 석 달"]])}</label>
    <div class="grid2"><label class="field"><span class="label">근무</span>${sel("icSh",o.shift,[["all","주간·야간 전부"],["ov","대근만"],["none","안 보냄"]])}</label>
      <label class="field"><span class="label">근무 알림</span>${sel("icShA",o.shiftAl,[["eve","전날 밤 9시"],[60,"1시간 전"],[120,"2시간 전"],["none","없음"]])}</label></div>
    ${ck("icT",o.tasks,"마감 있는 할 일")}
    <label class="field"><span class="label">할 일 알림 (마감 당일)</span><input id="icTT" type="time" value="${esc(o.taskTime)}"></label>
    ${db?ck("icS",o.shared,"함께 보는 일정"):""}
    ${workOK?ck("icK",o.stock,"주식 일정"):""}
    <label class="field"><span class="label">시간 있는 일정 알림</span>${sel("icEA",o.evAl,[[10,"10분 전"],[30,"30분 전"],[60,"1시간 전"],[1440,"하루 전"]])}</label>
    <p class="note">시간이 없는 일정은 전날 밤 9시에 알려 줘요.</p>
    ${ck("icN",o.onlyNew,"이미 보낸 건 빼고 새로 생기거나 바뀐 것만")}
    <div class="note" id="icMsg"></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="ghost" id="icClose">닫기</button><button class="primary" ${inClaude?"disabled":""}>캘린더 파일 만들기</button></div></form>`);
  document.getElementById("icClose").onclick=closeSheet;
  document.getElementById("icForm").onsubmit=e=>{e.preventDefault();
    const g=id=>document.getElementById(id);
    const n={range:Number(g("icR").value),shift:g("icSh").value,shiftAl:g("icShA").value,tasks:g("icT").checked,taskTime:g("icTT").value||"08:00",
      shared:g("icS")?g("icS").checked:o.shared,stock:g("icK")?g("icK").checked:o.stock,evAl:Number(g("icEA").value),onlyNew:g("icN").checked};
    S.icsOpt=n;S.icsSent=S.icsSent||{};
    let items=icsItems(n);
    if(n.onlyNew)items=items.filter(it=>{const p=S.icsSent[it.uid];return !p||p.h!==it.sig;});
    const msg=g("icMsg");
    if(!items.length){msg.textContent="새로 보낼 일정이 없어요. 전부 다시 보내려면 맨 아래 체크를 끄세요.";save();return;}
    items.forEach(it=>{const p=S.icsSent[it.uid];if(p&&p.h!==it.sig)p.q=(p.q||0)+1;});
    const txt=icsBuild(items);
    items.forEach(it=>{const p=S.icsSent[it.uid]||{q:0};S.icsSent[it.uid]={h:it.sig,q:p.q||0};});
    const cut=addDays(todayStr(),-60);Object.keys(S.icsSent).forEach(k=>{const m=k.match(/(\d{4}-\d{2}-\d{2})$/);if(m&&m[1]<cut)delete S.icsSent[k];});
    save();
    const blob=new Blob([txt],{type:"text/calendar;charset=utf-8"});const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="sucheop-"+todayStr()+".ics";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
    msg.innerHTML=`<b>${items.length}개</b>를 담은 캘린더 파일을 만들었어요.<br>`+(ios?"내려받은 파일을 열고 <b>모두 추가</b>를 누르세요.":"알림창이나 내 파일에서 내려받은 파일을 눌러 <b>삼성 캘린더</b>로 여세요.");
  };
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  if(e.target.id==="calBack"){calOpen=false;render();return;}
  const tb=e.target.closest("[data-tab]");
  if(tb){tab=tb.dataset.tab;calOpen=false;render();window.scrollTo(0,0);return;}
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==="rchk"){const t=todayStr();const v=el.dataset.v;const arr=S.rchk[t]||[];S.rchk[t]=el.checked?[...new Set([...arr,v])]:arr.filter(x=>x!==v);save();setTimeout(render,120);return;}
  if(a==="pstep"){const p=(S.projects||[]).find(x=>x.id===el.dataset.id);if(p){p.steps[Number(el.dataset.i)].d=el.checked;p.done=p.steps.every(x=>x.d);save();setTimeout(render,120);}return;}
  if(a==="toggle"){const t=S.tasks.find(x=>x.id===id);if(t){t.done=el.checked;t.doneAt=el.checked?todayStr():null;save();setTimeout(render,150);}return;}
  if(a==="editTask"){taskSheet(S.tasks.find(x=>x.id===id));}
  else if(a==="newTask"){taskSheet(null,el.dataset.d,el.dataset.q);}
  else if(a==="newEvent"){eventSheet(null,el.dataset.d);}
  else if(a==="editEvent"){eventSheet(S.events.find(x=>x.id===id));}
  else if(a==="settings"){settingsSheet();}
  else if(a==="logSub"){logSub=el.dataset.v;render();}
  else if(a==="stockSub"){stockSub=el.dataset.v;render();}
  else if(a==="startCat"){startCat(el.dataset.c);}
  else if(a==="stopRun"){stopRun();}
  else if(a==="delLog"){if(el.dataset.sure){S.logs=S.logs.filter(l=>l.id!==id);save();render();}else{el.dataset.sure=1;el.textContent="삭제?";}}
  else if(a==="addLog"){logSheet();}
  else if(a==="newProj"){projSheet(null,el.dataset.k);}
  else if(a==="editProj"){projSheet((S.projects||[]).find(x=>x.id===id));}
  else if(a==="logCat"){logSheet(el.dataset.c);}
  else if(a==="editLog"){logSheet(null,id);}
  else if(a==="logNav"){const v=Number(el.dataset.v);logDate=v===0?todayStr():addDays(logDate,v);if(logDate>todayStr())logDate=todayStr();render();}
  else if(a==="weekNav"){weekOff=Math.min(0,weekOff+Number(el.dataset.v));render();}
  else if(a==="openDay"){logDate=el.dataset.d;logSub="day";render();window.scrollTo(0,0);}
  else if(a==="mood"){const v=Number(el.dataset.v);setDay(logDate,{mood:dayRec(logDate).mood===v?null:v});render();}
  else if(a==="exToggle"){setDay(logDate,{ex:!dayRec(logDate).ex});render();}
  else if(a==="goLog"){tab="log";logSub="day";logDate=todayStr();render();window.scrollTo(0,0);}
  else if(a==="editRoutine"){routineSheet();}
  else if(a==="editQuotes"){quoteSheet();}
  else if(a==="qNav"){const v=Number(el.dataset.v);qOff=v===0?0:qOff+v;render();}
  else if(a==="mineQuote"){mineSheet(el.dataset.md);}
  else if(a==="ansQ"){ansSheet(el.dataset.md);}
  else if(a==="openRecur"){recurSheet();}
  else if(a==="ovSet"){S.shiftOv=S.shiftOv||{};const v=el.dataset.v;if(v===baseShift(selDate))delete S.shiftOv[selDate];else S.shiftOv[selDate]=v;save();pushShift();render();toast(v===baseShift(selDate)?"원래 근무로 돌렸어요":"대근으로 바꿨어요");}
  else if(a==="newShared"){sharedSheet(null,el.dataset.d);}
  else if(a==="seenShared"){S.seenShared=Date.now();save();render();}
  else if(a==="editShared"){sharedSheet(SE.find(x=>x.id===id));}
  else if(a==="ovClear"){if(S.shiftOv)delete S.shiftOv[selDate];save();pushShift();render();toast("원래 근무로 돌렸어요");}
  else if(a==="filter"){taskFilter=el.dataset.v;render();}
  else if(a==="clearDone"){if(el.dataset.sure){S.tasks=S.tasks.filter(x=>!x.done);save();render();toast("정리했어요");}else{el.dataset.sure=1;el.textContent="한 번 더 누르면 정리";}}
  else if(a==="pick"){selDate=el.dataset.d;const d=parseD(selDate);calMonth=[d.getFullYear(),d.getMonth()];calOpen=true;render();}
  else if(a==="calClose"){calOpen=false;render();}
  else if(a==="stripDay"){selDate=el.dataset.d;const d=parseD(selDate);calMonth=[d.getFullYear(),d.getMonth()];calOpen=true;tab="cal";render();window.scrollTo(0,0);}
  else if(a==="catEdit"){catSheet();}
  else if(a==="mon"){const v=Number(el.dataset.v);if(v===0){selDate=todayStr();calMonth=null;}else{let [y,m]=calMonth;m+=v;if(m<0){m=11;y--;}if(m>11){m=0;y++;}calMonth=[y,m];}render();}
  else if(a==="preset"){fibForm.preset=el.dataset.v;fibForm.filled=[false,false,false];document.querySelectorAll("#fPreset button").forEach(b=>b.setAttribute("aria-pressed",String(b===el)));updateFib();}
  else if(a==="fill"){fibForm.filled[Number(el.dataset.i)]=el.checked;updateFib();}
  else if(a==="saveFib"){const L=num(fibForm.L),H=num(fibForm.H);if(!(L>0&&H>L))return;
    S.fibs.push({id:uidGen(),name:(document.getElementById("fN").value||"").trim(),L,H,preset:fibForm.preset,at:todayStr()});
    if(S.fibs.length>60)S.fibs=S.fibs.slice(-60);save();render();toast("저장했어요");}
  else if(a==="loadFib"){const f=S.fibs.find(x=>x.id===id);if(f){fibForm.L=fmt(f.L);fibForm.H=fmt(f.H);fibForm.preset=f.preset;fibForm.filled=[false,false,false];render();document.getElementById("fN").value=f.name||"";window.scrollTo(0,0);}}
  else if(a==="delFib"){S.fibs=S.fibs.filter(x=>x.id!==id);save();render();}
  else if(a==="exportData"){exportSheet();}
  else if(a==="toCal"){icsSheet();}
  else if(a==="importOpen"){importSheet();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="resolve"){const ds=e.target.dataset.d,v=e.target.value.trim();S.resolve=S.resolve||{};if(v)S.resolve[ds]=v;else delete S.resolve[ds];save();return;}
  if(e.target.id==="diary"){const ds=logDate,v=e.target.value;clearTimeout(diaryT);const st=document.getElementById("diaryState");if(st)st.textContent="저장 중…";
    diaryT=setTimeout(()=>{setDay(ds,{diary:v});const s2=document.getElementById("diaryState");if(s2)s2.textContent="저장했어요";},600);return;}
  if(e.target.id==="fL"||e.target.id==="fH"){
    const raw=e.target.value.replace(/[^\d]/g,"");
    const f=raw?Number(raw).toLocaleString("ko-KR"):"";
    e.target.value=f;
    fibForm[e.target.id==="fL"?"L":"H"]=f;updateFib();
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

genRecurring();
if(fixNightStart())save();
render();
setInterval(()=>{if(!running())return;if(!(tab==="today"||(tab==="log"&&logSub==="day")))return;if(document.getElementById("sheet"))return;const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;render();},30000);
})();
</script>

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}</script>
